<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f2847" />
    <title>연결을 확인해 주세요 | 다대유</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Pretendard,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f7f7f7;
        color: #0a0a0a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        padding: 36px 28px;
        border: 1px solid #e5e5e5;
        border-radius: 28px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgb(15 40 71 / 10%);
        text-align: center;
      }

      img {
        width: 88px;
        height: 88px;
        border-radius: 22px;
      }

      h1 {
        margin: 24px 0 10px;
        font-size: 24px;
        line-height: 1.35;
        letter-spacing: -0.03em;
      }

      p {
        margin: 0;
        color: #5a5a5c;
        font-size: 16px;
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        min-height: 48px;
        margin-top: 26px;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        padding: 0 22px;
        background: #0a0a0a;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #00d4a4;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/pwa-192x192.png" alt="" width="88" height="88" />
      <h1>인터넷 연결을 확인해 주세요</h1>
      <p>연결이 돌아오면 다시 다대유의 장소와 여행 코스를 확인할 수 있어요.</p>
      <a href="/">다시 시도</a>
    </main>
  </body>
</html>
